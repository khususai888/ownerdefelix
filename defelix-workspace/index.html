<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e2022">
  <meta name="description" content="DEFelix Atelier Workspace — ruang kerja operasional untuk proyek, transaksi, dokumen, dan evaluasi atelier.">
  <title>DEFelix Atelier Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #191c1d;
      --slate: #1e2022;
      --slate-2: #343a40;
      --muted: #70777d;
      --line: #e2e5e9;
      --line-strong: #cfd3d7;
      --canvas: #f6f7f8;
      --panel: #fff;
      --wash: #f1f3f5;
      --green: #1b653f;
      --green-bg: #e8f5ed;
      --amber: #9b5a08;
      --amber-bg: #fff4df;
      --red: #a33a3a;
      --red-bg: #fff0ef;
      --blue: #315a78;
      --blue-bg: #ebf2f8;
      --radius: 8px;
      --shadow: 0 12px 32px -4px rgba(30,32,34,.12), 0 2px 6px rgba(30,32,34,.05);
      font-family: Manrope, "Segoe UI", Arial, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--ink); background: var(--canvas); font-size: 14px; line-height: 1.55; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #65717a; outline-offset: 2px; }
    a { color: inherit; text-decoration: none; }
    .app-shell { min-height: 100vh; }
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 30; display: flex; width: 264px; flex-direction: column; justify-content: space-between; background: #171a1d; color: #fff; padding: 22px 12px 14px; }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 10px 25px; }
    .brand-logo { display: block; width: 112px; height: 28px; object-fit: contain; filter: brightness(0) invert(1); }
    .workspace-tag { padding: 5px 8px; border: 1px solid rgba(255,255,255,.08); border-radius: 4px; color: #c1c6ca; background: #23282c; font-size: 9px; font-weight: 800; letter-spacing: .1em; }
    .nav-list { display: grid; gap: 5px; }
    .nav-link { display: flex; min-height: 43px; align-items: center; gap: 12px; border: 1px solid transparent; border-radius: 6px; color: #aab0b5; padding: 0 12px; font-size: 13px; font-weight: 600; transition: .18s ease; }
    .nav-link svg { flex: 0 0 auto; }
    .nav-link:hover { color: #fff; background: #202428; }
    .nav-link.active { color: #fff; border-color: rgba(255,255,255,.12); background: #282d31; box-shadow: inset 3px 0 #f3f4f5; }
    .sidebar-foot { padding: 12px 8px 0; }
    .profile { display: flex; align-items: center; gap: 11px; padding: 11px; border: 1px solid rgba(255,255,255,.05); border-radius: 8px; background: #202428; }
    .avatar { display: grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; border-radius: 50%; color: #fff; background: #3b4146; font-size: 12px; font-weight: 800; }
    .avatar img { display: block; width: 22px; height: 22px; object-fit: contain; filter: brightness(0) invert(1); }
    .profile-name { color: #fff; font-size: 12px; font-weight: 700; line-height: 1.2; }
    .role-tag { display: inline-block; margin-top: 4px; border-radius: 3px; background: #30363b; padding: 2px 6px; color: #d1d6d9; font-size: 8px; font-weight: 800; letter-spacing: .08em; }
    .main-shell { min-height: 100vh; margin-left: 264px; }
    .topbar { position: sticky; top: 0; z-index: 20; display: flex; min-height: 62px; align-items: center; justify-content: space-between; gap: 14px; border-bottom: 1px solid rgba(226,229,233,.8); background: rgba(246,247,248,.92); padding: 0 38px; backdrop-filter: blur(14px); }
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 12px; }
    .eyebrow { color: #72797f; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .topbar-context { color: #3e4449; font-size: 12px; font-weight: 600; }
    .topbar-date { border-left: 1px solid var(--line); padding-left: 14px; color: var(--muted); font-size: 11px; }
    .icon-button { position: relative; display: inline-grid; width: 36px; height: 36px; place-items: center; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: #50575c; }
    .icon-button:hover { border-color: #adb4b9; background: var(--wash); }
    .icon-button.trash-button:hover { border-color: #e3c7c5; background: var(--red-bg); color: var(--red); }
    .row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
    .mobile-menu { display: none; }
    main { width: min(100%, 1560px); margin: 0 auto; padding: 30px 38px 52px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 23px; }
    .page-kicker { margin: 0 0 4px; color: #7a8186; font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; color: #1b1e20; font-size: clamp(25px, 2.2vw, 32px); font-weight: 700; letter-spacing: -.045em; line-height: 1.15; }
    .page-subtitle { margin: 7px 0 0; color: #72797e; font-size: 12px; }
    .head-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .btn { display: inline-flex; min-height: 38px; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--slate); padding: 0 13px; font-size: 11px; font-weight: 700; transition: .16s ease; white-space: nowrap; }
    .btn:hover { border-color: #9ea5aa; background: #f5f6f7; }
    .btn.primary { border-color: var(--slate); background: var(--slate); color: #fff; }
    .btn.primary:hover { background: #343a40; }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn.danger { color: var(--red); }
    .btn.small { min-height: 30px; padding: 0 9px; font-size: 10px; }
    .btn:disabled { cursor: not-allowed; opacity: .45; }
    .grid { display: grid; gap: 15px; }
    .kpi-grid { grid-template-columns: repeat(3, minmax(0,1fr)); margin-bottom: 18px; }
    .kpi { min-height: 125px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 17px 18px 15px; }
    .kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #747b80; font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .kpi-icon { display: grid; width: 28px; height: 28px; place-items: center; border: 0; border-radius: 5px; background: #f1f3f5; color: #50575d; }
    button.kpi-icon { cursor: pointer; }
    button.kpi-icon:hover { background: #e6e9eb; color: #202528; }
    .kpi-value { margin-top: 11px; font-size: clamp(20px, 2vw, 25px); font-weight: 800; letter-spacing: -.055em; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .kpi-note { margin-top: 7px; color: #7c8388; font-size: 10px; }
    .kpi-note strong { color: #40474c; font-weight: 700; }
    .panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
    .panel-head { display: flex; min-height: 55px; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding: 13px 17px; }
    .panel-title { margin: 0; font-size: 14px; font-weight: 750; letter-spacing: -.025em; }
    .panel-caption { margin: 3px 0 0; color: var(--muted); font-size: 10px; }
    .panel-body { padding: 17px; }
    .dashboard-grid { grid-template-columns: minmax(0,1.55fr) minmax(270px,1fr); align-items: stretch; }
    .chart-controls { display: flex; align-items: center; gap: 5px; border-radius: 5px; background: #f1f3f5; padding: 3px; }
    .seg-btn { display: inline-flex; min-height: 28px; align-items: center; gap: 5px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #72797e; padding: 0 8px; font-size: 10px; font-weight: 700; }
    .seg-btn.active { border-color: var(--line); background: #fff; color: var(--slate); }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 16px; color: #747b80; font-size: 10px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; background: #25292c; }
    .legend-dot.red { background: #b64a4a; }
    .chart-wrap { width: 100%; overflow: hidden; padding-top: 7px; }
    .cash-chart { display: block; width: 100%; min-width: 460px; height: 230px; }
    .chart-foot { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 7px; border-top: 1px solid var(--line); padding-top: 13px; }
    .chart-period { min-width: 0; border: 1px solid #eceef0; border-radius: 5px; background: #fafbfc; padding: 7px 8px; }
    .chart-period span { display: block; color: #848b90; font-size: 8px; font-weight: 700; text-transform: uppercase; }
    .chart-period strong { display: block; margin-top: 4px; font-size: 10px; font-variant-numeric: tabular-nums; }
    .chart-period em { display: block; margin-top: 2px; color: #83898e; font-size: 8px; font-style: normal; }
    .task-list { display: grid; }
    .task-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid #edf0f1; padding: 12px 0; }
    .task-row:last-child { border: 0; }
    .task-name { max-width: 230px; overflow: hidden; color: #363c40; font-size: 11px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .task-meta { margin-top: 3px; color: #878e93; font-size: 9px; }
    .task-date { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 5px; color: #51585d; font-size: 9px; }
    .task-date.urgent { color: var(--red); }
    .evaluation-preview { margin-top: 16px; padding: 19px; background: #fbfbfc; }
    .metrics-grid { grid-template-columns: repeat(3,minmax(0,1fr)); margin: 15px 0 17px; }
    .metric-box { border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 13px; }
    .metric-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #737a7f; font-size: 9px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .metric-box strong { display: block; margin-top: 8px; font-size: 23px; letter-spacing: -.05em; }
    .metric-box small { color: var(--muted); font-size: 9px; }
    .progress { height: 5px; overflow: hidden; margin-top: 8px; border-radius: 99px; background: #eceff1; }
    .progress span { display: block; height: 100%; border-radius: inherit; background: #343a40; }
    .notes-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
    .note-card { display: flex; min-height: 154px; flex-direction: column; justify-content: space-between; border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 13px; }
    .note-card h3 { margin: 8px 0 6px; font-size: 11px; line-height: 1.45; }
    .note-card p { margin: 0; color: #727a7f; font-size: 10px; line-height: 1.5; }
    .note-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #858c91; font-size: 9px; }
    .note-link { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; border-top: 1px solid #eff1f2; padding-top: 9px; color: #41484d; font-size: 9px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
    .badge { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 4px; background: #f4f5f6; padding: 3px 7px; color: #4a5156; font-size: 9px; font-weight: 750; line-height: 1.3; white-space: nowrap; }
    .badge.success { border-color: #c9e4d2; background: var(--green-bg); color: var(--green); }
    .badge.warning { border-color: #f0dba9; background: var(--amber-bg); color: var(--amber); }
    .badge.danger { border-color: #f3cecb; background: var(--red-bg); color: var(--red); }
    .badge.blue { border-color: #d5e1ea; background: var(--blue-bg); color: var(--blue); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 15px 0; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; padding: 9px; }
    .searchbox { position: relative; display: flex; min-width: 210px; flex: 1 1 260px; align-items: center; }
    .searchbox svg { position: absolute; left: 11px; color: #82898e; pointer-events: none; }
    .searchbox input { width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 5px; background: #fafbfc; padding: 0 11px 0 36px; color: var(--ink); font-size: 11px; }
    .searchbox input::placeholder { color: #9aa1a6; }
    .select { height: 36px; min-width: 120px; border: 1px solid var(--line); border-radius: 5px; background: #fff; padding: 0 30px 0 10px; color: #4d5459; font-size: 10px; }
    .view-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; background: #f1f3f5; padding: 3px; }
    .view-switch .seg-btn { min-height: 28px; }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { position: sticky; top: 0; border-bottom: 1px solid var(--line); background: #f7f8f9; padding: 10px 13px; color: #788086; font-size: 8px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; white-space: nowrap; }
    td { border-bottom: 1px solid #edf0f1; padding: 12px 13px; color: #4a5156; font-size: 10px; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: #fafbfc; }
    .table-title { color: #23282b; font-size: 10px; font-weight: 750; }
    .table-sub { margin-top: 3px; color: #858c91; font-size: 8px; }
    .progress-cell { min-width: 130px; }
    .progress-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #62696e; font-size: 9px; }
    .progress-line .progress { flex: 1; min-width: 55px; margin: 0; }
    .mono { font-variant-numeric: tabular-nums; }
    .project-cards { grid-template-columns: repeat(3,minmax(0,1fr)); padding: 14px; }
    .project-card { border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 15px; }
    .project-card h2 { margin: 11px 0 5px; font-size: 13px; letter-spacing: -.02em; }
    .project-card p { min-height: 40px; margin: 8px 0 12px; color: #737b80; font-size: 10px; }
    .project-card-foot { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #eef0f2; padding-top: 11px; color: #71797e; font-size: 9px; }
    .stat-chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 5px; background: #fff; padding: 8px 11px; color: #61686d; font-size: 10px; }
    .stat-chip strong { color: var(--ink); font-size: 13px; }
    .stat-dot { width: 7px; height: 7px; border-radius: 50%; background: #ae4d4d; }
    .stat-dot.green { background: #238052; }
    .stat-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
    .report-kpis { grid-template-columns: repeat(3,minmax(0,1fr)); margin-bottom: 15px; }
    .report-kpis .kpi { min-height: 108px; }
    .filter-panel { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; padding: 10px; }
    .filter-spacer { flex: 1; }
    .table-panel { overflow: hidden; }
    .table-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding: 11px 14px; color: #7b8287; font-size: 9px; }
    .transaction-type { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; }
    .amount-in { color: #276b47; font-weight: 800; white-space: nowrap; }
    .amount-out { color: #41484d; font-weight: 750; white-space: nowrap; }
    .cancelled td { color: #a3a8ac; }
    .docs-banner { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 15px; border: 1px solid var(--line); border-radius: 7px; background: #fff; padding: 13px 16px; }
    .format-list { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: #646c71; font-size: 10px; }
    .format-chip { border: 1px solid #e8eaec; border-radius: 3px; background: #f7f8f9; padding: 3px 6px; color: #555d62; font-size: 8px; font-weight: 750; }
    .dropzone { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 15px; border: 1px dashed #bfc5c9; border-radius: 7px; background: #fff; padding: 15px 17px; transition: .18s ease; }
    .dropzone.dragover { border-color: #30363a; background: #f3f5f6; }
    .dropzone-left { display: flex; align-items: center; gap: 12px; }
    .dropzone-icon { display: grid; width: 37px; height: 37px; place-items: center; border: 1px solid var(--line); border-radius: 6px; background: #f5f6f7; color: #30363a; }
    .dropzone-title { font-size: 12px; font-weight: 750; }
    .dropzone-sub { color: #81888d; font-size: 9px; }
    .docs-layout { grid-template-columns: minmax(0,1.55fr) minmax(250px,.75fr); align-items: start; }
    .filter-tabs { display: flex; flex-wrap: wrap; gap: 4px; }
    .filter-tab { min-height: 29px; border: 1px solid transparent; border-radius: 4px; background: transparent; padding: 0 9px; color: #777e83; font-size: 9px; font-weight: 700; }
    .filter-tab:hover { background: #f1f3f5; }
    .filter-tab.active { border-color: #282d31; background: #282d31; color: #fff; }
    .file-row { cursor: pointer; }
    .file-row.selected td { background: #f4f6f7; }
    .file-cell { display: flex; align-items: center; gap: 10px; min-width: 220px; }
    .file-icon { display: grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; border: 1px solid #e6e8ea; border-radius: 5px; background: #f8f9fa; color: #4a5157; }
    .file-icon.pdf { border-color: #f0d9d7; background: #fff4f3; color: #9c4541; }
    .file-icon.image { border-color: #d6e3ee; background: #f0f7fc; color: #386484; }
    .file-preview { padding: 16px; }
    .preview-art { display: grid; min-height: 195px; place-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: repeating-linear-gradient(135deg,#f3f4f5,#f3f4f5 10px,#eef0f2 10px,#eef0f2 20px); }
    .preview-paper { display: grid; width: 112px; height: 145px; place-items: center; border: 1px solid #d5d9dc; background: #fff; color: #6a7277; box-shadow: 0 5px 16px rgba(20,30,35,.08); }
    .preview-paper span { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 50%; background: #f0f2f3; }
    .preview-caption { padding: 12px 0 0; }
    .preview-caption strong { display: block; overflow-wrap: anywhere; font-size: 11px; }
    .preview-caption small { color: #7b8388; font-size: 9px; }
    .preview-note { min-width: 0; max-width: 100%; margin: 13px 0; border: 1px solid #eceef0; border-radius: 5px; background: #fafbfc; padding: 10px; color: #687076; font-size: 10px; overflow-wrap: anywhere; word-break: break-word; }
    .empty-state { padding: 28px 16px; color: #858d92; text-align: center; font-size: 10px; }
    .empty-state svg { display: block; margin: 0 auto 8px; color: #9ba2a7; }
    .eval-summary { grid-template-columns: repeat(3,minmax(0,1fr)); margin-bottom: 16px; }
    .evaluation-list { display: grid; gap: 10px; padding: 14px; }
    .evaluation-item { display: grid; grid-template-columns: 1fr auto; gap: 15px; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
    .evaluation-item h2 { margin: 7px 0 4px; font-size: 12px; }
    .evaluation-item p { margin: 0; color: #737b80; font-size: 10px; }
    .evaluation-side { display: grid; justify-items: end; gap: 9px; }
    .evaluation-actions { display: flex; align-items: center; gap: 7px; }
    .evaluation-date { color: #838a8f; font-size: 9px; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; overflow: auto; background: rgba(24,28,30,.42); padding: 20px; backdrop-filter: blur(5px); }
    .modal { width: min(100%, 560px); max-height: min(90vh,850px); overflow: auto; border: 1px solid var(--line); border-radius: 9px; background: #fff; box-shadow: var(--shadow); animation: modal-in .17s ease-out; }
    .modal.wide { width: min(100%,700px); }
    @keyframes modal-in { from { opacity: 0; transform: translateY(7px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); background: #fafbfc; padding: 18px 20px; }
    .modal-head h2 { margin: 0; font-size: 17px; letter-spacing: -.035em; }
    .modal-head p { margin: 4px 0 0; color: #7a8287; font-size: 10px; }
    .modal-body { display: grid; gap: 14px; padding: 19px 20px; }
    .modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); background: #fafbfc; padding: 13px 20px; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .field { display: grid; gap: 5px; }
    .field.full { grid-column: 1/-1; }
    .field label { color: #3d4449; font-size: 10px; font-weight: 750; }
    .field input, .field select, .field textarea { width: 100%; min-height: 38px; border: 1px solid var(--line); border-radius: 5px; background: #fff; padding: 8px 10px; color: var(--ink); font-size: 11px; }
    .field textarea { min-height: 78px; resize: vertical; }
    .field-hint { color: #899095; font-size: 9px; }

      const [year,month]=state.selectedMonth.split('-').map(Number), daysInMonth=new Date(Date.UTC(year,month,0)).getUTCDate();
      const monthShort=new Intl.DateTimeFormat('id-ID',{timeZone:'UTC',month:'short'}).format(new Date(Date.UTC(year,month-1,1)));
      const periods=Array.from({length:5},(_,index)=>({start:index*7+1,end:Math.min((index+1)*7,daysInMonth),income:0,out:0}));
      monthlyBookedTransactions().forEach(t=>{const bucket=Math.min(4,Math.floor((transactionDay(t)-1)/7));if(bucket<0)return;if(t.type==='Pemasukan')periods[bucket].income+=Number(t.amount);else periods[bucket].out+=Number(t.amount);});
      return {periods:periods.filter(p=>p.start<=daysInMonth),monthShort};
    }
    function chartSvg() {
      const {periods,monthShort}=weeklyCashData(), maxValue=Math.max(5000000,Math.ceil(Math.max(...periods.flatMap(p=>[p.income,p.out]))/5000000)*5000000), xs=periods.map((_,i)=>70+i*(600/Math.max(1,periods.length-1))), y=value=>180-(value/maxValue)*150;
      const ticks=[maxValue,maxValue*.75,maxValue*.5,maxValue*.25];
      const grid=ticks.map((value,i)=>{const yy=30+i*37.5;return `<path d="M55 ${yy}H680"/><text x="8" y="${yy+4}" fill="#858c91" stroke="none">${(value/1000000).toLocaleString('id-ID',{maximumFractionDigits:1})} jt</text>`;}).join('')+'<path d="M55 180H680"/><text x="27" y="184" fill="#858c91" stroke="none">0</text>';
      const labels=periods.map((p,i)=>`<text x="${xs[i]}" y="205">${p.start}–${p.end} ${monthShort}</text>`).join('');
      if(state.chart==='bars'){
        const bars=periods.map((p,i)=>{const base=xs[i]-19, inY=y(p.income),outY=y(p.out);return `<rect x="${base}" y="${inY}" width="17" height="${180-inY}" rx="3" fill="#343a40"/><rect x="${base+21}" y="${outY}" width="17" height="${180-outY}" rx="3" fill="#b64a4a"/>`;}).join('');
        return `<svg class="cash-chart" viewBox="0 0 700 240" role="img" aria-label="Grafik batang pemasukan dan pengeluaran mingguan"><g stroke="#e9ecee" stroke-width="1">${grid}</g><g fill="#747c81" font-size="9" font-family="Manrope,Arial" text-anchor="middle">${labels}</g>${bars}</svg>`;
      }
      const inPoints=periods.map((p,i)=>`${xs[i]},${y(p.income)}`).join(' '),outPoints=periods.map((p,i)=>`${xs[i]},${y(p.out)}`).join(' ');
      const inArea=`M${xs[0]} 180 L${inPoints.replaceAll(' ',',')} L${xs.at(-1)} 180 Z`,outArea=`M${xs[0]} 180 L${outPoints.replaceAll(' ',',')} L${xs.at(-1)} 180 Z`;
      const points=(values,color)=>values.map((v,i)=>`<circle cx="${xs[i]}" cy="${y(v)}" r="4.5" fill="#fff" stroke="${color}" stroke-width="2.2"/>`).join('');
      return `<svg class="cash-chart" viewBox="0 0 700 240" role="img" aria-label="Grafik garis arus kas mingguan"><defs><linearGradient id="fillIncome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#343a40" stop-opacity=".12"/><stop offset="1" stop-color="#343a40" stop-opacity="0"/></linearGradient><linearGradient id="fillOutgoing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b64a4a" stop-opacity=".12"/><stop offset="1" stop-color="#b64a4a" stop-opacity="0"/></linearGradient></defs><g stroke="#e9ecee" stroke-width="1">${grid}</g><path d="${inArea}" fill="url(#fillIncome)"/><path d="${outArea}" fill="url(#fillOutgoing)"/><polyline points="${inPoints}" fill="none" stroke="#343a40" stroke-width="2.5"/><polyline points="${outPoints}" fill="none" stroke="#b64a4a" stroke-width="2.5"/>${points(periods.map(p=>p.income),'#343a40')}${points(periods.map(p=>p.out),'#b64a4a')}<g fill="#747c81" font-size="9" font-family="Manrope,Arial" text-anchor="middle">${labels}</g></svg>`;
    }

    function requestDelete(kind,id) {
      const config={project:{key:'projects',label:'proyek',name:'name'},transaction:{key:'transactions',label:'transaksi',name:'memo'},document:{key:'documents',label:'dokumen',name:'name'},evaluation:{key:'evaluations',label:'catatan evaluasi',name:'title'}}[kind];

      const item=state[config.key].find(entry=>entry.id===id); if(!item)return;

      modal(`Hapus ${config.label}?`,'Konfirmasi penghapusan',`<div class="modal-body"><p style="margin:0;color:#5f676c;font-size:11px;line-height:1.7">Anda akan menghapus <strong>${escapeHtml(item[config.name])}</strong>. Data ini akan dihapus dari daftar dan penyimpanan browser.</p></div>`,`<button class="btn" data-action="close-modal">Batal</button><button class="btn primary" style="background:#9d3c38;border-color:#9d3c38" data-action="confirm-delete">${icon('trash',14)} Hapus</button>`);

    function confirmDelete() {

      persist(pending.key); state.pendingDelete=null; closeModal(); renderApp(); toast(`${pending.label.charAt(0).toUpperCase()+pending.label.slice(1)} berhasil dihapus.`);
    }

    function handleAction(action,target) {
      if(action==='menu'){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebarShade').classList.toggle('show');}
      if(action==='notifications')toast('Tidak ada notifikasi baru.');

      if(action==='edit-balance')openBalanceForm();
      if(action==='current-period'){state.selectedMonth=currentJakartaMonth();state.monthIsManual=false;closeModal();renderApp();toast(`Periode diatur ke ${monthTitle()}.`);}
      if(action==='chart-bars'||action==='chart-trend'){state.chart=action==='chart-bars'?'bars':'trend';renderApp();}
      if(action==='new-project')openProjectForm(); if(action==='project-detail')openProjectDetail(target.dataset.id);
      if(action==='project-table'||action==='project-cards'){state.projectView=action==='project-table'?'table':'cards';renderApp();}
      if(action==='new-transaction')openTransactionForm(); if(action==='export-csv')exportTransactions();
      if(action==='book-transaction'){const trx=state.transactions.find(t=>t.id===target.dataset.id);if(trx){trx.status='Dibukukan';state.balance+=signedTransactionAmount(trx);persist('transactions');persistBalance();renderApp();toast(`${trx.id} dibukukan dan saldo diperbarui.`);}}
      if(action==='upload-doc')openUploadForm();
      if(action==='doc-filter'){state.docFilter=target.dataset.value;renderApp();}
      if(action==='report-type'){state.reportType=target.dataset.value;renderApp();}
      if(action==='select-doc'){state.selectedDoc=target.dataset.id;renderApp();}
      if(action==='download-doc')downloadDocument(target.dataset.id);
      if(action==='download-selected')downloadDocument(state.selectedDoc);
      if(action==='new-evaluation')openEvaluationForm();
      if(action==='delete-item')requestDelete(target.dataset.kind,target.dataset.id);
      if(action==='confirm-delete')confirmDelete();
      if(action==='evaluation-detail'){const item=state.evaluations.find(e=>e.id===target.dataset.id);if(item&&item.status!=='Selesai'){item.status='Selesai';persist('evaluations');renderApp();toast('Tindak lanjut ditandai selesai.');}else if(item)modal('Detail evaluasi',item.date,`<div class="modal-body"><div>${badge(item.kind,'blue')} ${badge(item.status,'success')}</div><h3 style="font-size:13px;margin:0">${escapeHtml(item.title)}</h3><p style="color:#697177;font-size:11px">${escapeHtml(item.solution)}</p></div>`,`<button class="btn" data-action="close-modal">Tutup</button>`);}
      if(action==='complete-project'){const p=state.projects.find(x=>x.id===target.dataset.id);if(p){p.status='Selesai';p.progress=100;p.done=p.total;persist('projects');closeModal();renderApp();toast('Proyek ditandai selesai.');}}
      if(action==='close-modal')closeModal();
    }

      if(event.target.id==='transactionForm'){event.preventDefault();const f=new FormData(event.target),type=f.get('type'),date=f.get('date')||currentJakartaDateISO(),transaction={id:`TRX-${String(Date.now()).slice(-3)}`,date:new Date(`${date}T00:00:00`).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}),dateISO:date,month:date.slice(0,7),type,memo:f.get('memo').trim(),category:f.get('category'),project:f.get('project'),amount:Number(f.get('amount')),status:'Dibukukan'};state.transactions.unshift(transaction);state.balance+=signedTransactionAmount(transaction);state.selectedMonth=transaction.month;state.monthIsManual=state.selectedMonth!==currentJakartaMonth();persist('transactions');persistBalance();closeModal();state.page='reports';location.hash='reports';renderApp();toast('Transaksi tersimpan dan langsung masuk ke cashflow.');}
      if(event.target.id==='uploadForm'){event.preventDefault();const f=new FormData(event.target),file=f.get('file');if(!file||!file.name){toast('Pilih berkas terlebih dahulu.');return;}const ext=(file.name.split('.').pop()||'').toLowerCase();if(!['pdf','jpg','jpeg','png','docx','xlsx','csv','zip'].includes(ext)){toast('Format berkas ini belum didukung.');return;}if(file.size>20*1024*1024){toast('Ukuran berkas melewati batas 20 MB.');return;}const format=ext.toUpperCase().replace('JPEG','JPG');const doc={id:`d${Date.now()}`,name:f.get('title').trim()||file.name,originalName:file.name,format,size:file.size>1024*1024?`${(file.size/1024/1024).toFixed(1)} MB`:`${Math.max(1,Math.round(file.size/1024))} KB`,category:f.get('category'),date:'5 Nov 2026',note:f.get('note')||'Berkas ditambahkan ke arsip atelier.',fileObject:file};state.documents.unshift(doc);persist('documents');state.selectedDoc=doc.id;closeModal();state.page='documents';location.hash='documents';renderApp();toast('Dokumen berhasil ditambahkan ke arsip.');}
      if(event.target.id==='evaluationForm'){event.preventDefault();const f=new FormData(event.target),date=f.get('date');state.evaluations.unshift({id:`e${Date.now()}`,date:date?new Date(`${date}T00:00:00`).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'5 Nov 2026',kind:f.get('kind'),status:'Dipantau',title:f.get('title').trim(),solution:f.get('solution')||'Belum ada rekomendasi yang dicatat.'});persist('evaluations');closeModal();state.page='evaluations';location.hash='evaluations';renderApp();toast('Catatan evaluasi tersimpan.');}
    });
    document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeModal();document.getElementById('sidebar').classList.remove('open');document.getElementById('sidebarShade').classList.remove('show');}});
    document.getElementById('app').addEventListener('dragover',event=>{if(state.page==='documents'){event.preventDefault();document.getElementById('dropzone')?.classList.add('dragover');}});
    document.getElementById('app').addEventListener('dragleave',event=>{if(!event.relatedTarget?.closest?.('#dropzone'))document.getElementById('dropzone')?.classList.remove('dragover');});
    document.getElementById('app').addEventListener('drop',event=>{if(state.page!=='documents')return;event.preventDefault();document.getElementById('dropzone')?.classList.remove('dragover');const file=event.dataTransfer.files?.[0];if(file){openUploadForm();const input=document.getElementById('uploadFile');const transfer=new DataTransfer();transfer.items.add(file);input.files=transfer.files;selectFileForUpload(file);}});
    window.addEventListener('hashchange',()=>{state.page=location.hash.slice(1)||'dashboard';renderApp();});
    document.querySelectorAll('[data-icon]').forEach(node=>node.outerHTML=icon(node.dataset.icon,19));
    updateHeaderDate();
    setInterval(updateHeaderDate,60000);
    renderApp();
  </script>
</body>
</html>
